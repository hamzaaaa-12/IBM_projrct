<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Emotion Detector</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            max-width: 640px;
            margin: 60px auto;
            padding: 0 20px;
            color: #222;
        }
        h1 {
            text-align: center;
        }
        textarea {
            width: 100%;
            height: 100px;
            font-size: 16px;
            padding: 10px;
            box-sizing: border-box;
        }
        button {
            margin-top: 10px;
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
        }
        #system_response {
            margin-top: 20px;
            font-size: 16px;
            white-space: pre-wrap;
        }
    </style>
</head>
<body>
    <h1>Emotion Detector</h1>
    <p>Enter a statement below to find out its emotion.</p>

    <textarea id="textToAnalyze" placeholder="Type your text here..."></textarea><br>
    <button onclick="RunSentimentAnalysis()">Analyze</button>

    <div id="system_response"></div>

    <script src="/static/mywebscript.js"></script>
</body>
</html>
